<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tú, yo y nuestros carros 💘</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #231934, #0f1018);
      color: #f4f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .contador {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .btn-chip {
      background: rgba(168, 85, 247, 0.22);
      color: #f3e8ff;
      border: 1px solid rgba(192, 132, 252, 0.35);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pagina {
      background: #fdfbf7;
      color: #1b1e26;
      border-radius: 19px;
      padding: 15px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.48);
      transition: transform 0.22s ease, opacity 0.22s ease;
      min-height: 395px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pagina.animando {
      opacity: 0.2;
      transform: scale(0.97);
    }

    /* PORTADA */
    .portada {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 4px;
      margin: auto 0;
    }

    .etiqueta-portada {
      background: #f3e8ff;
      color: #7e22ce;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .portada h1 {
      font-size: 1.4rem;
      line-height: 1.2;
      color: #18181b;
    }

    .portada p {
      font-size: 0.84rem;
      color: #4b5563;
      max-width: 320px;
      line-height: 1.42;
    }

    .portada-img {
      width: 168px;
      height: 168px;
      border-radius: 15px;
      overflow: hidden;
      border: 2.5px solid #e9d5ff;
      box-shadow: 0 8px 20px rgba(126, 34, 206, 0.16);
      background: #f3efe6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .portada-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 11px;
    }

    .btn-abrir {
      margin-top: 3px;
      background: linear-gradient(135deg, #9333ea, #e11d48);
      color: #fff;
      padding: 9px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    /* MARCO DE IMAGEN DE CARRO */
    .marco-imagen {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f3efe6;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 6px;
    }

    .marco-imagen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 10px;
    }

    .placeholder-foto {
      padding: 12px;
      text-align: center;
      color: #6b7280;
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .pie-pagina {
      margin-top: 11px;
      text-align: center;
    }

    .marca-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #7e22ce;
      background: #f3e8ff;
      padding: 2px 9px;
      border-radius: 999px;
      margin-bottom: 4px;
    }

    .pie-pagina h2 {
      font-size: 1.1rem;
      margin-bottom: 3px;
    }

    .pie-pagina p {
      font-size: 0.82rem;
      color: #4b5563;
      line-height: 1.35;
    }

    /* SECCIÓN FINAL: ELLA Y CARRITOS REGALADOS */
    .final-seccion {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .final-header {
      text-align: center;
    }

    .final-header h2 {
      font-size: 1.12rem;
      color: #18181b;
    }

    .final-header p {
      font-size: 0.78rem;
      color: #52525b;
      margin-top: 2px;
    }

    .bloque-titulo {
      font-size: 0.82rem;
      font-weight: 700;
      color: #7e22ce;
      margin-bottom: 6px;
    }

    .grid-recuerdos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card-recuerdo {
      background: #f8f5f0;
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 11px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-recuerdo .thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: #ece7df;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.72rem;
      color: #6b7280;
      padding: 4px;
    }

    .card-recuerdo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-recuerdo h4 {
      font-size: 0.78rem;
      color: #1f2937;
    }

    .card-recuerdo p {
      font-size: 0.72rem;
      color: #4b5563;
      line-height: 1.3;
    }

    .dedicatoria-cierre {
      background: linear-gradient(135deg, #f3e8ff, #ffe4e6);
      padding: 9px;
      border-radius: 11px;
      text-align: center;
      font-size: 0.78rem;
      color: #3b0764;
      font-weight: 500;
      line-height: 1.35;
    }

    /* CONTROLES */
    .controles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .controles button {
      padding: 9px 12px;
      border: none;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      background: #9333ea;
      color: #fff;
      transition: transform 0.15s ease, filter 0.15s ease, opacity 0.2s ease;
    }

    .controles button:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .controles button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top-bar">
      <button id="btn-portada" class="btn-chip" type="button">Portada</button>
      <span id="contador" class="contador">Portada</span>
      <button id="btn-recuerdos" class="btn-chip" type="button">Recuerdos 💘</button>
    </header>

    <section class="libro-wrapper">
      <article class="pagina" id="pagina"></article>
    </section>

    <nav class="controles">
      <button id="btn-prev" type="button">← Anterior</button>
      <button id="btn-next" type="button">Siguiente →</button>
    </nav>
  </main>

  <script>
    // 1. PORTADA
    const portadaData = {
      etiqueta: "Para ti, mi persona favorita 💘",
      titulo: "Tú y yo 💘",
      subtitulo:
        "Cada carro aquí es una excusa para imaginar todos los momentos que quiero vivir contigo.",
      imagen: "img/portada.jpeg"
    };

    // 2. SOLO LOS 13 AUTOS DE LAS IMÁGENES QUE ENVIASTE
    const paginasCarros = [
      { marca: "Ford", titulo: "Ford Mustang", imagen: "img/mustang.jpeg", nota: "Clásico muscle car para salir a rodar juntos." },
      { marca: "Chevrolet", titulo: "Chevrolet Camaro", imagen: "img/camaro.jpeg", nota: "Presencia oscura y actitud deportiva." },
      { marca: "Dodge", titulo: "Dodge Charger", imagen: "img/charger.jpeg", nota: "Sedán con alma de muscle." },
      { marca: "Dodge", titulo: "Dodge Challenger", imagen: "img/challenger.jpeg", nota: "Estilo retro que nunca pasa de moda." },
      { marca: "Chevrolet", titulo: "Chevrolet Corvette", imagen: "img/corvette.jpeg", nota: "Líneas afiladas y puro rendimiento." },
      { marca: "Toyota", titulo: "Toyota Supra", imagen: "img/supra.jpeg", nota: "Ícono JDM en rojo para destacar." },
      { marca: "Mercedes-AMG", titulo: "Mercedes-AMG GT", imagen: "img/mercedes.jpeg", nota: "Elegancia alemana con toque agresivo." },
      { marca: "Nissan", titulo: "Nissan Z", imagen: "img/nissan-z.jpeg", nota: "Herencia Z moderna y bien plantada." },
      { marca: "BMW", titulo: "BMW M4 Coupé", imagen: "img/bmw.jpeg", nota: "Azul deportivo con actitud de pista." },
      { marca: "Porsche", titulo: "Porsche 911 GT3", imagen: "img/porsche.jpeg", nota: "Verde circuito y precisión pura." },
      { marca: "Nissan", titulo: "Nissan GT-R", imagen: "img/nissan-gtr.jpeg", nota: "Godzilla listo para cualquier curva." },
      { marca: "RAM", titulo: "RAM TRX", imagen: "img/ram-trx.jpeg", nota: "Pick-up bestial para dominar cualquier camino." },
      { marca: "Ford", titulo: "Ford Raptor", imagen: "img/ford-raptor.jpeg", nota: "Off-road resistente y con mucha presencia." }
    ];

    // 3. SECCIÓN FINAL: FOTOS DE ELLA Y CARRITOS QUE TE REGALÓ
    const fotosDeElla = [
      {
        imagen: "img/ella-1.jpeg",
        titulo: "Mi vista favorita ✨",
        texto: "No importa qué carro mire, tú siempre vas a ser lo más bonito."
      },
      {
        imagen: "img/ella-2.jpeg",
        titulo: "Contigo todo es mejor 💜",
        texto: "Gracias por estar en cada momento y apoyarme en lo que me gusta."
      }
    ];

    const carritosRegalados = [
      {
        imagen: "img/regalo-1.jpeg",
        titulo: "El carrito que me regalaste #1",
        texto: "De mis favoritos en toda mi colección porque vino de ti."
      },
      {
        imagen: "img/regalo-2.jpeg",
        titulo: "El carrito que me regalaste #2",
        texto: "Cada vez que lo veo me acuerdo de ti y de este detalle."
      }
    ];

    const mensajeFinal =
      "Estos carritos que me regalaste valen más que cualquier hiperauto del mundo porque tienen tu cariño. Te quiero muchísimo 💘";

    // --- LÓGICA DE NAVEGACIÓN ---
    const totalPaginas = paginasCarros.length + 2;
    let indiceActual = 0;

    const paginaEl = document.getElementById("pagina");
    const contadorEl = document.getElementById("contador");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");

    function manejarErrorImagen(imgEl, srcOriginal, textoFallback) {
      if (!imgEl.dataset.intentoJpg) {
        imgEl.dataset.intentoJpg = "1";
        imgEl.src = srcOriginal.replace(/\.jpeg$/i, ".jpg");
        return;
      }
      imgEl.outerHTML = `<div class="placeholder-foto">📷 ${textoFallback}<br><small>Guárdala como: <strong>${srcOriginal}</strong></small></div>`;
    }

    function crearImgConFallback(src, alt, textoFallback) {
      return `<img src="${src}" alt="${alt}" onerror="manejarErrorImagen(this, '${src}', '${textoFallback}')" />`;
    }

    function renderizar(nuevoIndice) {
      paginaEl.classList.add("animando");

      setTimeout(() => {
        indiceActual = nuevoIndice;

        if (indiceActual === 0) {
          contadorEl.textContent = "Portada";
          paginaEl.innerHTML = `
            <div class="portada">
              <span class="etiqueta-portada">${portadaData.etiqueta}</span>
              <div class="portada-img">
                ${crearImgConFallback(portadaData.imagen, "Portada", "Imagen de portada")}
              </div>
              <h1>${portadaData.titulo}</h1>
              <p>${portadaData.subtitulo}</p>
              <button class="btn-abrir" type="button" onclick="renderizar(1)">
                Abrir nuestro librito →
              </button>
            </div>
          `;
        } else if (indiceActual === totalPaginas - 1) {
          contadorEl.textContent = "Recuerdos 💘";

          const htmlElla = fotosDeElla
            .map(
              (item) => `
              <div class="card-recuerdo">
                <div class="thumb">${crearImgConFallback(item.imagen, item.titulo, "Foto de ella")}</div>
                <h4>${item.titulo}</h4>
                <p>${item.texto}</p>
              </div>`
            )
            .join("");

          const htmlCarritos = carritosRegalados
            .map(
              (item) => `
              <div class="card-recuerdo">
                <div class="thumb">${crearImgConFallback(item.imagen, item.titulo, "Carrito regalado")}</div>
                <h4>${item.titulo}</h4>
                <p>${item.texto}</p>
              </div>`
            )
            .join("");

          paginaEl.innerHTML = `
            <div class="final-seccion">
              <div class="final-header">
                <h2>La mejor parte de mi colección 💘</h2>
                <p>Más allá de los autos soñados, esto es lo que más guardo en el corazón.</p>
              </div>

              <div>
                <div class="bloque-titulo">📸 Tú, mi persona favorita</div>
                <div class="grid-recuerdos">${htmlElla}</div>
              </div>

              <div>
                <div class="bloque-titulo">🏎️ Los carritos que me regalaste</div>
                <div class="grid-recuerdos">${htmlCarritos}</div>
              </div>

              <div class="dedicatoria-cierre">${mensajeFinal}</div>
            </div>
          `;
        } else {
          const carroIdx = indiceActual - 1;
          const carro = paginasCarros[carroIdx];
          contadorEl.textContent = `Carro ${carroIdx + 1} / ${paginasCarros.length}`;

          paginaEl.innerHTML = `
            <div class="marco-imagen">
              ${crearImgConFallback(carro.imagen, carro.titulo, `Imagen de ${carro.titulo}`)}
            </div>
            <div class="pie-pagina">
              <span class="marca-tag">${carro.marca}</span>
              <h2>${carro.titulo}</h2>
              <p>${carro.nota}</p>
            </div>
          `;
        }

        btnPrev.disabled = indiceActual === 0;
        btnNext.disabled = indiceActual === totalPaginas - 1;
        paginaEl.classList.remove("animando");
      }, 130);
    }

    btnPrev.addEventListener("click", () => {
      if (indiceActual > 0) renderizar(indiceActual - 1);
    });

    btnNext.addEventListener("click", () => {
      if (indiceActual < totalPaginas - 1) renderizar(indiceActual + 1);
    });

    document.getElementById("btn-portada").addEventListener("click", () => renderizar(0));
    document.getElementById("btn-recuerdos").addEventListener("click", () => renderizar(totalPaginas - 1));

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" && indiceActual > 0) renderizar(indiceActual - 1);
      if (e.key === "ArrowRight" && indiceActual < totalPaginas - 1) renderizar(indiceActual + 1);
    });

    renderizar(0);
  </script>
</body>
</html>
